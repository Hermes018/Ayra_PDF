name: Release Cross-Platform (Windows MSVC + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app-tauri/pnpm-lock.yaml

      - name: Install Rust toolchain (1.85.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
          targets: ${{ matrix.target }}

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm --dir app-tauri install --frozen-lockfile

      - name: Frontend typecheck & Vitest suite
        run: |
          pnpm --dir app-tauri check
          pnpm --dir app-tauri vitest run

      - name: Workspace Rust tests & Protocol Audits
        run: |
          cargo test --workspace
          cargo xtask studio-audit --strict
          cargo xtask feature-map-check
          cargo xtask protocol-lint

      - name: Build Tauri Release Installer (${{ matrix.bundles }})
        run: pnpm --dir app-tauri tauri build --bundles ${{ matrix.bundles }}

      - name: Upload Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: localpdf-studio-${{ matrix.target }}
          path: |
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: ignore
