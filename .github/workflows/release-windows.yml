name: Release Cross-Platform (Windows MSVC + Linux)

# Shared source lives in master/. Each bundle merges an OS overlay from its platform folder:
#   fedora/packaging/tauri.fedora.conf.json   (rpm)
#   ubuntu/packaging/tauri.ubuntu.conf.json   (deb)
#   windows/packaging/tauri.windows.conf.json (nsis, msi)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: master

jobs:
  verify-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: rpm
            overlay: fedora/packaging/tauri.fedora.conf.json
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            overlay: ubuntu/packaging/tauri.ubuntu.conf.json
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            overlay: windows/packaging/tauri.windows.conf.json

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            qpdf \
            rpm

      - name: Install Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: master/app-tauri/pnpm-lock.yaml

      - name: Install Rust toolchain (stable, matches master/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: master

      - name: Install frontend dependencies
        run: pnpm --dir app-tauri install --frozen-lockfile

      - name: Frontend typecheck & Vitest suite
        run: |
          pnpm --dir app-tauri check
          pnpm --dir app-tauri vitest run

      - name: Fetch test corpus
        if: runner.os == 'Linux'
        run: bash corpus/fetch.sh

      - name: Workspace Rust tests & Protocol Audits
        run: |
          cargo test --workspace
          cargo xtask studio-audit --strict
          cargo xtask feature-map-check
          cargo xtask protocol-lint

      - name: Build bundled CLI + sandboxed worker (shipped inside Linux packages)
        if: runner.os == 'Linux'
        run: cargo build --release -p lpdf-cli -p lpdf-worker

      - name: Build Tauri Release Installer (${{ matrix.bundles }})
        run: pnpm --dir app-tauri tauri build --bundles ${{ matrix.bundles }} --config "${{ github.workspace }}/${{ matrix.overlay }}"

      - name: Upload Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: localpdf-studio-${{ matrix.target }}-${{ matrix.bundles }}
          path: |
            master/target/release/bundle/rpm/*.rpm
            master/target/release/bundle/deb/*.deb
            master/target/release/bundle/nsis/*.exe
            master/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
