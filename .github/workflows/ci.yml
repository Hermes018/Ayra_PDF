name: CI Gate

# Development happens in master/ (shared workspace). Every job runs from there.
# OS folders (fedora/, ubuntu/, windows/, ...) only hold packaging overlays; see /tree.md.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: master

jobs:
  gate:
    name: Gate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-44
            os: ubuntu-latest
            container: fedora:44
          - name: ubuntu-24.04
            os: ubuntu-24.04
            container: null
          - name: windows
            os: windows-latest
            container: null

    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Fedora)
        if: matrix.name == 'fedora-44'
        run: |
          dnf install -y webkit2gtk4.1-devel openssl-devel librsvg2-devel libappindicator-gtk3-devel libxdo-devel gcc gcc-c++ qpdf poppler-utils tesseract libreoffice wget
          # Bare fedora container: install rustup and cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies (Ubuntu)
        if: matrix.name == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential qpdf poppler-utils pandoc

      - name: Setup stable Rust
        run: |
          rustup default stable
          rustup component add clippy rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: master

      - name: Install cargo extensions (Fedora)
        if: matrix.name == 'fedora-44'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deny cargo-audit cargo-nextest

      - name: Install cargo extensions (Ubuntu / Windows)
        if: matrix.name != 'fedora-44'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest

      - name: Fetch test corpus (Linux)
        if: matrix.name != 'windows'
        run: bash corpus/fetch.sh

      - name: Run gate
        run: cargo xtask gate
