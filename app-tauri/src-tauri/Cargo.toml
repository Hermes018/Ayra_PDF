[package]
name = "app-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "5.0"
lpdf-core-types = { path = "../../crates/lpdf-core-types" }
lpdf-fs-safety = { path = "../../crates/lpdf-fs-safety" }
lpdf-hw = { path = "../../crates/lpdf-hw" }
lpdf-jobs = { path = "../../crates/lpdf-jobs" }
lpdf-engine-pdfcraft = { path = "../../crates/lpdf-engine-pdfcraft" }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "75360d1d7db06fed974f48c914d4c04132757187" }
tokio = { version = "1", features = ["rt", "sync"] }
ts-rs = "12.0.1"
tauri-plugin-dialog = "2.8.1"
