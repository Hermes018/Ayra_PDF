# UPSTREAM_MANIFEST.toml — every upstream relationship (ADR-018 rev 3, R3). Supersedes
# master/upstream/UPSTREAM.toml from ADR-018 rev 2. One [[upstream]] per adopted crate, local patch,
# or KEEP-PORT source file. Read by `cargo xtask upstream-check` (offline: compares `rev` with the
# ~/craft-ref clones after a manual `git fetch` there). Bump procedure: docs/UPGRADING.md.
#
# kind = "dependency" | "patch" | "port"
# vendored = path of the vendored copy (cargo source replacement in .cargo/config.toml), if any

[[upstream]]
name = "pdfcraft"
kind = "dependency"
repo = "https://github.com/storytold/pdfcraft"
rev = "75360d1d7db06fed974f48c914d4c04132757187"   # v0.15.0
license = "MIT OR Apache-2.0"
adapter = "crates/lpdf-engine-pdfcraft"          # behind lpdf-engine-port::PdfEngine; app-tauri studio.rs also uses pdfcraft_engine::Session directly (migration pending)
vendored = "vendor/pdfcraft"                     # git submodule
last_checked = "2026-11-06"

[[upstream]]
name = "winprint"
kind = "patch"                                   # ADR-017: src/ byte-identical, Cargo.toml without build-deps
repo = "https://github.com/storytold/winprint.rs"
rev = "5f80b9baf6b58937c401656634e42d33f00ddf49"
license = "BSD-3-Clause"
local = "vendor/patches/winprint"
paths = ["src", "Cargo.toml", "build.rs"]
requested_by = "craft-print"                     # via pdfcraft's craft-libs pin
notes = "vendor/patches/winprint/PATCH_NOTES.md"
last_checked = "2026-11-06"

[[upstream]]
name = "craft-winprint-gdi"
kind = "dependency"
repo = "https://github.com/storytold/winprint.rs"
rev = "417ac3c4d14d3da5485a99c7d5ce8f05664ec312"
license = "BSD-3-Clause"
requested_by = "craft-print"
last_checked = "2026-11-06"

