[package]
name = "localpdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lpdf-engine-switcher = { path = "../crates/lpdf-engine-switcher" }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_pdfcraft_load"
path = "fuzz_targets/fuzz_pdfcraft_load.rs"
test = false
doc = false

[[bin]]
name = "fuzz_fallback_load"
path = "fuzz_targets/fuzz_fallback_load.rs"
test = false
doc = false

[[bin]]
name = "fuzz_engine_switcher"
path = "fuzz_targets/fuzz_engine_switcher.rs"
test = false
doc = false

[[bin]]
name = "fuzz_fs_and_ai_rpc"
path = "fuzz_targets/fuzz_fs_and_ai_rpc.rs"
test = false
doc = false
