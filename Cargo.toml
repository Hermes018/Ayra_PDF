[workspace]
members = [
    "xtask",
    "crates/*",
    "app-tauri/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Test <test@example.com>"]
rust-version = "1.74"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
